<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokoSaya - Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>TokoSaya</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="checkout.html">Keranjang</a>
    </nav>
  </header>

  <section class="slider">
    <div class="slides">
      <img src="images/slide1.jpg" alt="Slide 1">
      <img src="images/slide2.jpg" alt="Slide 2">
      <img src="images/slide3.jpg" alt="Slide 3">
    </div>
  </section>

  <section class="products">
    <h2>Pilihan Produk</h2>
    <div class="grid">
      <div class="card">
        <img src="images/product1.jpg" alt="iPhone 17 Basic">
        <h3>iPhone 17 Basic</h3>
        <p>Mulai dari $999</p>
        <button onclick="window.location.href='product.html?item=basic'">Beli</button>
      </div>
      <div class="card">
        <img src="images/product2.jpg" alt="iPhone 17 Air">
        <h3>iPhone 17 Air</h3>
        <p>Mulai dari $1199</p>
        <button onclick="window.location.href='product.html?item=air'">Beli</button>
      </div>
      <div class="card">
        <img src="images/product3.jpg" alt="iPhone 17 Pro">
        <h3>iPhone 17 Pro</h3>
        <p>Mulai dari $1399</p>
        <button onclick="window.location.href='product.html?item=pro'">Beli</button>
      </div>
      <div class="card">
        <img src="images/product4.jpg" alt="iPhone 17 Pro Max">
        <h3>iPhone 17 Pro Max</h3>
        <p>Mulai dari $1599</p>
        <button onclick="window.location.href='product.html?item=promax'">Beli</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 TokoSaya</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
